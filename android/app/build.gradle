plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace "com.ojitos369.fruquis"
    compileSdk 34
    defaultConfig {
        applicationId "com.ojitos369.fruquis"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    // misma firma de depuración en cualquier equipo (Windows, Linux, CI): se puede actualizar la app sin desinstalarla. Solo para builds debug, no para publicar.
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.10.01")
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.compose.material3:material3"
}
